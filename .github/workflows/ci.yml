name: Anonymity & Integrity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Strict Anonymity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make scripts executable
        run: chmod +x *.sh scripts/*.sh

      - name: Run automated test suite
        run: bash test.sh

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans 2>/dev/null || true
          docker system prune -f 2>/dev/null || true

      - name: Dump warp-proxy logs on failure
        if: failure()
        run: docker logs warp-proxy-service --tail 100 2>/dev/null || echo "Container not available"
